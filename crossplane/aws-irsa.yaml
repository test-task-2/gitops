# Stamp provider pods with IRSA. AWS ProviderConfig comes later, after
# provider-family-aws installs ClusterProviderConfig CRDs.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: irsa
spec:
  serviceAccountTemplate:
    metadata:
      name: crossplane-aws
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::767398111127:role/cool-crossplane
