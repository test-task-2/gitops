# PostgreSQL in Terraform subnet group cool-db.
# SG is Terraform cool-db, discovered by AWS tags (not a hardcoded sg- id).
apiVersion: v1
kind: Secret
metadata:
  name: cool-postgres
  namespace: data
type: Opaque
stringData:
  password: "ChangeMeByAutoGen1!"
---
apiVersion: platform.cool/v1alpha1
kind: PostgresInstance
metadata:
  name: cool-postgres
  namespace: data
spec:
  region: us-east-1
  identifier: cool-postgres
  engineVersion: "16.13"
  instanceClass: db.t3.micro
  dbSubnetGroupName: cool-db
  vpcSecurityGroupSelector:
    tags:
      Tier: db
