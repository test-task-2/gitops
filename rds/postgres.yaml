# PostgreSQL in Terraform subnet group cool-db (isolated db subnets).
# Playground: db.t3.micro, no custom KMS, no monitoring role.
apiVersion: v1
kind: Secret
metadata:
  name: cool-postgres
  namespace: data
type: Opaque
stringData:
  password: "ChangeMeByAutoGen1!"
---
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: SecurityGroup
metadata:
  name: cool-postgres
  namespace: data
  labels:
    app: cool-postgres
spec:
  forProvider:
    region: us-east-1
    description: PostgreSQL from VPC app subnets
    name: cool-postgres
    vpcId: vpc-0d32e91be210186f0
    tags:
      Name: cool-postgres
      Project: cool
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
---
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: SecurityGroupRule
metadata:
  name: cool-postgres-5432
  namespace: data
spec:
  forProvider:
    region: us-east-1
    type: ingress
    protocol: tcp
    fromPort: 5432
    toPort: 5432
    cidrBlocks:
      - 10.42.0.0/16
    securityGroupIdSelector:
      matchLabels:
        app: cool-postgres
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
---
apiVersion: rds.aws.m.upbound.io/v1beta1
kind: Instance
metadata:
  name: cool-postgres
  namespace: data
spec:
  forProvider:
    region: us-east-1
    identifier: cool-postgres
    engine: postgres
    engineVersion: "16.6"
    instanceClass: db.t3.micro
    allocatedStorage: 20
    storageType: gp2
    storageEncrypted: true
    dbName: app
    username: appadmin
    autoGeneratePassword: true
    passwordSecretRef:
      name: cool-postgres
      key: password
    dbSubnetGroupName: cool-db
    vpcSecurityGroupIdSelector:
      matchLabels:
        app: cool-postgres
    publiclyAccessible: false
    multiAz: false
    backupRetentionPeriod: 0
    skipFinalSnapshot: true
    deletionProtection: false
    autoMinorVersionUpgrade: true
    applyImmediately: true
    tags:
      Name: cool-postgres
      Project: cool
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  writeConnectionSecretToRef:
    name: cool-postgres-conn
