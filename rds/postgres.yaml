# PostgreSQL in Terraform subnet group cool-db.
# Master password is created by RDS and stored in Secrets Manager.
# App user password is in Secrets Manager secret cool/postgres-app and rotated by Lambda.
apiVersion: platform.cool/v1alpha1
kind: PostgresInstance
metadata:
  name: cool-postgres
  namespace: data
spec:
  region: us-east-1
  identifier: cool-postgres
  engineVersion: "16.13"
  instanceClass: db.t3.micro
  dbSubnetGroupName: cool-db
  vpcSecurityGroupSelector:
    tags:
      Tier: db
  appUsername: app
  rotateAfterDays: 30
