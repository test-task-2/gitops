apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-alb
spec:
  controllerName: gateway.k8s.aws/alb
---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: argocd-alb
  namespace: argocd
spec:
  scheme: internet-facing
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: argocd-server
  namespace: argocd
spec:
  targetReference:
    kind: Service
    name: argocd-server
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /healthz
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd
  namespace: argocd
spec:
  gatewayClassName: aws-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: argocd-alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: argocd.test-task.drunk.guru
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: argocd
      sectionName: http
  hostnames:
    - argocd.test-task.drunk.guru
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
