apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-crd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter-crd
    targetRevision: 1.8.3
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: 1.8.3
    helm:
      releaseName: karpenter
      values: |
        settings:
          clusterName: cool
        serviceAccount:
          name: karpenter
          create: true
        nodeSelector:
          role: system
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodepool
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 20
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: karpenter.sh
      kind: NodePool
      jqPathExpressions:
        - .metadata.annotations["karpenter.sh/nodepool-hash"]
        - .metadata.annotations["karpenter.sh/nodepool-hash-version"]
    - group: karpenter.k8s.aws
      kind: EC2NodeClass
      jqPathExpressions:
        - .metadata.annotations["karpenter.k8s.aws/ec2nodeclass-hash"]
        - .metadata.annotations["karpenter.k8s.aws/ec2nodeclass-hash-version"]
  source:
    repoURL: https://github.com/test-task-2/gitops.git
    targetRevision: HEAD
    path: karpenter
