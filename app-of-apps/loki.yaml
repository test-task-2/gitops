apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  sources:
    # Single-binary Loki, filesystem on emptyDir. Restart loses logs.
    # Prod: S3 object storage + SimpleScalable (read/write/backend) or
    # 3x Monolithic replicas. Enable the compactor and set
    # loki.limits_config.retention_period (e.g. 672h). Do not use
    # filesystem/emptyDir. Example:
    #   loki:
    #     storage:
    #       type: s3
    #       bucketNames:
    #         chunks: cool-loki-chunks
    #         ruler: cool-loki-ruler
    #         admin: cool-loki-admin
    #       s3:
    #         region: us-east-1
    #     limits_config:
    #       retention_period: 672h
    #   deploymentMode: SimpleScalable
    #   singleBinary:
    #     replicas: 0
    # Alloy stays the same; only loki.write URL changes (gateway or Grafana Cloud).
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.55.0
      helm:
        releaseName: loki
        values: |
          deploymentMode: SingleBinary
          loki:
            auth_enabled: false
            useTestSchema: true
            commonConfig:
              replication_factor: 1
            storage:
              type: filesystem
            limits_config:
              retention_period: 24h
              allow_structured_metadata: true
              volume_enabled: true
          singleBinary:
            replicas: 1
            nodeSelector:
              role: system
            persistence:
              enabled: false
            extraVolumes:
              - name: storage
                emptyDir: {}
            extraVolumeMounts:
              - name: storage
                mountPath: /var/loki
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
          read:
            replicas: 0
          write:
            replicas: 0
          backend:
            replicas: 0
          gateway:
            enabled: false
          lokiCanary:
            enabled: false
          test:
            enabled: false
          chunksCache:
            enabled: false
          resultsCache:
            enabled: false
          minio:
            enabled: false
          monitoring:
            selfMonitoring:
              enabled: false
              grafanaAgent:
                installOperator: false
            lokiCanary:
              enabled: false
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        releaseName: alloy
        values: |
          controller:
            type: deployment
            replicas: 1
            nodeSelector:
              role: system
          alloy:
            extraPorts: []
            configMap:
              content: |
                logging {
                  level  = "info"
                  format = "logfmt"
                }

                discovery.kubernetes "pods" {
                  role = "pod"
                  namespaces {
                    names = ["voting"]
                  }
                }

                discovery.relabel "voting" {
                  targets = discovery.kubernetes.pods.targets

                  rule {
                    source_labels = ["__meta_kubernetes_namespace"]
                    target_label  = "namespace"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_name"]
                    target_label  = "pod"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_container_name"]
                    target_label  = "container"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                    target_label  = "app"
                  }
                }

                loki.source.kubernetes "voting" {
                  targets    = discovery.relabel.voting.output
                  forward_to = [loki.write.default.receiver]
                }

                loki.write "default" {
                  endpoint {
                    url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
                  }
                }
          crds:
            create: false
