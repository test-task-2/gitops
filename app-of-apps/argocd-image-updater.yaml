apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: 1.3.1
      helm:
        releaseName: argocd-image-updater
        values: |
          replicaCount: 1
          nodeSelector:
            role: system
          serviceAccount:
            create: true
            name: argocd-image-updater
          extraArgs:
            - --interval
            - 2m
          extraEnv:
            - name: HOME
              value: /tmp
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: PATH
              value: /aws/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: PYTHONPATH
              value: /aws
          initContainers:
            - name: awscli
              image: public.ecr.aws/docker/library/python:3.12-alpine
              command: [pip, install, --no-cache-dir, --target, /aws, awscli]
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
              volumeMounts:
                - name: aws
                  mountPath: /aws
          volumes:
            - name: aws
              emptyDir: {}
          volumeMounts:
            - name: aws
              mountPath: /aws
              readOnly: true
          authScripts:
            enabled: true
            scripts:
              ecr-login.sh: |
                #!/bin/sh
                aws ecr get-login-password --region us-east-1 | awk '{print "AWS:" $0}'
          config:
            registries:
              - name: ECR
                api_url: https://112334179404.dkr.ecr.us-east-1.amazonaws.com
                prefix: 112334179404.dkr.ecr.us-east-1.amazonaws.com
                credentials: ext:/scripts/ecr-login.sh
                credsexpire: 10h
    - repoURL: https://github.com/test-task-2/gitops.git
      targetRevision: HEAD
      path: argocd-image-updater
      helm:
        releaseName: voting-app-image-updater
