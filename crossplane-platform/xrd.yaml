apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgresinstances.platform.cool
spec:
  scope: Namespaced
  group: platform.cool
  names:
    kind: PostgresInstance
    plural: postgresinstances
  defaultCompositionRef:
    name: rds-postgres
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: SYNCED
          type: string
          jsonPath: .status.conditions[?(@.type=='Synced')].status
        - name: READY
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
        - name: SGS
          type: string
          jsonPath: .status.vpcSecurityGroupIds
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - region
                - dbSubnetGroupName
                - vpcSecurityGroupSelector
              properties:
                region:
                  type: string
                identifier:
                  type: string
                  description: RDS instance identifier. Defaults to metadata.name.
                engineVersion:
                  type: string
                  default: "16.6"
                instanceClass:
                  type: string
                  default: db.t3.micro
                allocatedStorage:
                  type: integer
                  default: 20
                dbName:
                  type: string
                  default: app
                username:
                  type: string
                  default: appadmin
                dbSubnetGroupName:
                  type: string
                vpcSecurityGroupSelector:
                  type: object
                  required:
                    - tags
                  properties:
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                      description: AWS resource tags that must uniquely match one security group.
            status:
              type: object
              properties:
                vpcSecurityGroupIds:
                  type: array
                  items:
                    type: string
