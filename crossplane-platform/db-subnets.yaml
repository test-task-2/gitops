# Observe the Terraform database subnets (Tier=db, subnet group cool-db).
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: Subnet
metadata:
  name: cool-db-us-east-1a
  namespace: crossplane-system
spec:
  managementPolicies: ["Observe"]
  forProvider:
    region: us-east-1
    tags:
      Name: cool-db-us-east-1a
      Tier: db
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
---
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: Subnet
metadata:
  name: cool-db-us-east-1b
  namespace: crossplane-system
spec:
  managementPolicies: ["Observe"]
  forProvider:
    region: us-east-1
    tags:
      Name: cool-db-us-east-1b
      Tier: db
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
