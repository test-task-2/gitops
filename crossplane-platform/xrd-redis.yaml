apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: redisinstances.platform.cool
spec:
  scope: Namespaced
  group: platform.cool
  names:
    kind: RedisInstance
    plural: redisinstances
  defaultCompositionRef:
    name: elasticache-redis
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: SYNCED
          type: string
          jsonPath: .status.conditions[?(@.type=='Synced')].status
        - name: READY
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
        - name: ENDPOINT
          type: string
          jsonPath: .status.endpoint
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - region
                - subnetGroupName
                - vpcSecurityGroupSelector
              properties:
                region:
                  type: string
                identifier:
                  type: string
                  description: ElastiCache replication group id. Defaults to metadata.name.
                engineVersion:
                  type: string
                  default: "7.1"
                nodeType:
                  type: string
                  default: cache.t4g.micro
                subnetGroupName:
                  type: string
                vpcSecurityGroupSelector:
                  type: object
                  required:
                    - tags
                  properties:
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                      description: AWS resource tags that must uniquely match one security group.
            status:
              type: object
              properties:
                vpcSecurityGroupIds:
                  type: array
                  items:
                    type: string
                endpoint:
                  type: string
                appSecretName:
                  type: string
