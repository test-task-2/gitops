{{- $region := required "region from terraform-values.yaml" .Values.region }}
{{- $pools := list
  (dict "tier" "db" "subnets" (.Values.databaseSubnets | default list))
  (dict "tier" "redis" "subnets" (.Values.elasticacheSubnets | default list))
}}
{{- range $pools }}
{{- $tier := .tier }}
{{- range .subnets }}
---
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: Subnet
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    crossplane.io/external-name: {{ .id | quote }}
spec:
  managementPolicies: ["Observe"]
  forProvider:
    region: {{ $region }}
    availabilityZone: {{ .availabilityZone }}
    tags:
      Name: {{ .name }}
      Tier: {{ $tier }}
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
{{- end }}
{{- end }}
