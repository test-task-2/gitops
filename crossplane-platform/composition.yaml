apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: rds-postgres
spec:
  compositeTypeRef:
    apiVersion: platform.cool/v1alpha1
    kind: PostgresInstance
  mode: Pipeline
  pipeline:
    - step: lookup-sg-and-compose-rds
      functionRef:
        name: function-python
      input:
        apiVersion: python.fn.crossplane.io/v1beta1
        kind: Script
        script: |
          import base64
          import datetime
          import hashlib
          import hmac
          import json
          import os
          import secrets
          import string
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          from crossplane.function import response


          def _local(tag):
              return tag.split("}", 1)[-1]


          def _creds():
              uri = os.environ.get("AWS_CONTAINER_CREDENTIALS_FULL_URI")
              token_file = os.environ.get("AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE")
              if uri:
                  headers = {}
                  if token_file:
                      with open(token_file, encoding="utf-8") as fh:
                          headers["Authorization"] = fh.read().strip()
                  req = urllib.request.Request(uri, headers=headers)
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      data = json.load(resp)
                  token = data["Token"] if "Token" in data else data["SessionToken"] if "SessionToken" in data else None
                  return data["AccessKeyId"], data["SecretAccessKey"], token
              key = os.environ.get("AWS_ACCESS_KEY_ID")
              secret = os.environ.get("AWS_SECRET_ACCESS_KEY")
              if not key or not secret:
                  raise RuntimeError("no AWS credentials on function pod (need Pod Identity)")
              return key, secret, os.environ.get("AWS_SESSION_TOKEN")


          def _sign(key, msg):
              return hmac.new(key, msg.encode("utf-8"), hashlib.sha256).digest()


          def _ec2_ids(region, action, set_tag, id_tag, tags):
              access, secret, session = _creds()
              params = {
                  "Action": action,
                  "Version": "2016-11-15",
              }
              for i, (k, v) in enumerate(tags.items(), start=1):
                  params["Filter.%d.Name" % i] = "tag:%s" % k
                  params["Filter.%d.Value.1" % i] = str(v)

              payload = urllib.parse.urlencode(params)
              payload_hash = hashlib.sha256(payload.encode("utf-8")).hexdigest()
              now = datetime.datetime.now(datetime.timezone.utc)
              amz_date = now.strftime("%Y%m%dT%H%M%SZ")
              datestamp = now.strftime("%Y%m%d")
              host = "ec2.%s.amazonaws.com" % region
              scope = "%s/%s/ec2/aws4_request" % (datestamp, region)

              headers = {
                  "content-type": "application/x-www-form-urlencoded",
                  "host": host,
                  "x-amz-content-sha256": payload_hash,
                  "x-amz-date": amz_date,
              }
              if session:
                  headers["x-amz-security-token"] = session

              signed_headers = ";".join(sorted(headers))
              canonical_headers = "".join("%s:%s\n" % (k, headers[k]) for k in sorted(headers))
              canonical_request = "POST\n/\n\n%s\n%s\n%s" % (canonical_headers, signed_headers, payload_hash)
              string_to_sign = "AWS4-HMAC-SHA256\n%s\n%s\n%s" % (
                  amz_date,
                  scope,
                  hashlib.sha256(canonical_request.encode("utf-8")).hexdigest(),
              )
              k_date = _sign(("AWS4" + secret).encode("utf-8"), datestamp)
              k_region = hmac.new(k_date, region.encode("utf-8"), hashlib.sha256).digest()
              k_service = hmac.new(k_region, b"ec2", hashlib.sha256).digest()
              k_signing = hmac.new(k_service, b"aws4_request", hashlib.sha256).digest()
              signature = hmac.new(k_signing, string_to_sign.encode("utf-8"), hashlib.sha256).hexdigest()

              http_headers = {
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Host": host,
                  "X-Amz-Content-Sha256": payload_hash,
                  "X-Amz-Date": amz_date,
                  "Authorization": "AWS4-HMAC-SHA256 Credential=%s/%s, SignedHeaders=%s, Signature=%s" % (
                      access, scope, signed_headers, signature,
                  ),
              }
              if session:
                  http_headers["X-Amz-Security-Token"] = session

              req = urllib.request.Request(
                  "https://%s/" % host,
                  data=payload.encode("utf-8"),
                  headers=http_headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      body = resp.read()
              except urllib.error.HTTPError as exc:
                  raise RuntimeError("EC2 %s HTTP %s: %s" % (action, exc.code, exc.read().decode()[:800])) from exc

              root = ET.fromstring(body)
              for el in root.iter():
                  if _local(el.tag) != "Error":
                      continue
                  code = message = ""
                  for child in el:
                      if _local(child.tag) == "Code":
                          code = child.text or ""
                      if _local(child.tag) == "Message":
                          message = child.text or ""
                  if code:
                      raise RuntimeError("EC2 %s: %s" % (code, message))

              ids = []
              for info in root.iter():
                  if _local(info.tag) != set_tag:
                      continue
                  for item in info:
                      if _local(item.tag) != "item":
                          continue
                      for child in item:
                          if _local(child.tag) == id_tag and child.text:
                              ids.append(child.text)
                              break
              return ids


          def describe_security_groups(region, tags):
              return _ec2_ids(region, "DescribeSecurityGroups", "securityGroupInfo", "groupId", tags)


          def describe_subnets(region, tags):
              return _ec2_ids(region, "DescribeSubnets", "subnetSet", "subnetId", tags)


          def _get(obj, key, default=None):
              if key in obj:
                  return obj[key]
              return default


          def _obs(req, name):
              if name not in req.observed.resources:
                  return None
              return req.observed.resources[name].resource


          def _at_provider(res):
              if not res or "status" not in res:
                  return {}
              st = res["status"]
              if "atProvider" not in st:
                  return {}
              return st["atProvider"]


          def _master_arn(rds):
              at = _at_provider(rds)
              mus = _get(at, "masterUserSecret")
              if not mus:
                  return ""
              first = mus[0]
              return str(_get(first, "secretArn") or "")


          def _lambda_arn(stack):
              at = _at_provider(stack)
              outs = _get(at, "outputs")
              if not outs:
                  return ""
              if "RotationLambdaARN" in outs:
                  return str(outs["RotationLambdaARN"])
              try:
                  for item in outs:
                      key = str(_get(item, "outputKey") or _get(item, "OutputKey") or "")
                      if key in ("RotationLambdaARN", "RotationLambdaArn"):
                          return str(_get(item, "outputValue") or _get(item, "OutputValue") or "")
              except TypeError:
                  pass
              return ""


          def compose(req, rsp):
              xr = req.observed.composite.resource
              spec = xr["spec"]
              name = xr["metadata"]["name"]
              region = spec["region"]
              tags_raw = spec["vpcSecurityGroupSelector"]["tags"]
              tags = {str(k): str(v) for k, v in tags_raw.items()}
              if not tags:
                  response.fatal(rsp, "spec.vpcSecurityGroupSelector.tags is empty")
                  return

              try:
                  ids = describe_security_groups(region, tags)
              except Exception as exc:
                  response.fatal(rsp, "security group tag lookup failed: %s" % exc)
                  return

              if len(ids) != 1:
                  response.fatal(
                      rsp,
                      "expected exactly 1 security group for tags %s, found %d: %s" % (tags, len(ids), ids),
                  )
                  return

              identifier = _get(spec, "identifier") or name
              db_name = _get(spec, "dbName") or "app"
              master_user = _get(spec, "username") or "appadmin"
              app_user = _get(spec, "appUsername") or "app"
              rotate_after = int(_get(spec, "rotateAfterDays") or 30)
              app_secret_name = "cool/postgres-app"
              k8s_app_secret = "%s-app" % identifier
              provider = {
                  "kind": "ClusterProviderConfig",
                  "name": "default",
              }

              status = rsp.desired.composite.resource.get_or_create_struct("status")
              status["vpcSecurityGroupIds"] = ids
              status["appSecretName"] = app_secret_name

              rsp.desired.resources["rds"].resource.update({
                  "apiVersion": "rds.aws.m.upbound.io/v1beta1",
                  "kind": "Instance",
                  "metadata": {
                      "name": identifier,
                  },
                  "spec": {
                      "forProvider": {
                          "region": region,
                          "identifier": identifier,
                          "engine": "postgres",
                          "engineVersion": _get(spec, "engineVersion") or "16.13",
                          "instanceClass": _get(spec, "instanceClass") or "db.t3.micro",
                          "allocatedStorage": int(_get(spec, "allocatedStorage") or 20),
                          "storageType": "gp2",
                          "storageEncrypted": True,
                          "dbName": db_name,
                          "username": master_user,
                          "manageMasterUserPassword": True,
                          "dbSubnetGroupName": spec["dbSubnetGroupName"],
                          "vpcSecurityGroupIds": ids,
                          "publiclyAccessible": False,
                          "multiAz": False,
                          "backupRetentionPeriod": 0,
                          "skipFinalSnapshot": True,
                          "deletionProtection": False,
                          "autoMinorVersionUpgrade": True,
                          "applyImmediately": True,
                          "tags": {
                              "Name": identifier,
                              "Project": "cool",
                          },
                      },
                      "providerConfigRef": provider,
                      "writeConnectionSecretToRef": {
                          "name": "%s-conn" % identifier,
                      },
                  },
              })

              rds = _obs(req, "rds")
              at = _at_provider(rds)
              endpoint = str(_get(at, "address") or "")
              port = int(_get(at, "port") or 5432)
              master_arn = _master_arn(rds)
              if endpoint:
                  status["endpoint"] = "%s:%s" % (endpoint, port)
              if master_arn:
                  status["masterUserSecretArn"] = master_arn

              notes = ["attached security group %s from tags %s" % (ids[0], tags)]
              if not endpoint:
                  response.normal(rsp, "; ".join(notes + ["waiting for RDS endpoint"]))
                  return
              if not master_arn:
                  response.normal(rsp, "; ".join(notes + ["waiting for RDS master secret in Secrets Manager"]))
                  return

              try:
                  rotate_sgs = describe_security_groups(region, {"Tier": "rds-rotate"})
                  node_subnets = sorted(describe_subnets(region, {"Tier": "nodes"}))
              except Exception as exc:
                  response.fatal(rsp, "rotation network lookup failed: %s" % exc)
                  return
              if len(rotate_sgs) != 1:
                  response.fatal(rsp, "expected 1 security group Tier=rds-rotate, found %s" % rotate_sgs)
                  return
              if not node_subnets:
                  response.fatal(rsp, "no subnets with tag Tier=nodes for rotation Lambda")
                  return

              seed_name = "%s-app-seed" % identifier
              obs_seed = _obs(req, "app-seed")
              secret_string = ""
              wo_version = 1
              if obs_seed:
                  data = _get(obs_seed, "data") or {}
                  if "secret-string" in data:
                      secret_string = base64.b64decode(data["secret-string"]).decode()
              if secret_string:
                  seed_obj = json.loads(secret_string)
                  if seed_obj.get("masterarn") != master_arn:
                      seed_obj["masterarn"] = master_arn
                      seed_obj["host"] = endpoint
                      seed_obj["port"] = port
                      secret_string = json.dumps(seed_obj)
                      wo_version = 2
              else:
                  alphabet = string.ascii_letters + string.digits
                  app_password = "".join(secrets.choice(alphabet) for _ in range(32))
                  secret_string = json.dumps({
                      "engine": "postgres",
                      "host": endpoint,
                      "port": port,
                      "dbname": db_name,
                      "username": app_user,
                      "password": app_password,
                      "masterarn": master_arn,
                  })
              seed_obj = json.loads(secret_string)

              rsp.desired.resources["app-seed"].resource.update({
                  "apiVersion": "v1",
                  "kind": "Secret",
                  "metadata": {
                      "name": seed_name,
                  },
                  "type": "Opaque",
                  "stringData": {
                      "username": seed_obj["username"],
                      "password": seed_obj["password"],
                      "host": str(seed_obj.get("host") or endpoint),
                      "port": str(seed_obj.get("port") or port),
                      "dbname": str(seed_obj.get("dbname") or db_name),
                      "secret-string": secret_string,
                  },
              })

              rsp.desired.resources["app-secret"].resource.update({
                  "apiVersion": "secretsmanager.aws.m.upbound.io/v1beta1",
                  "kind": "Secret",
                  "metadata": {
                      "name": k8s_app_secret,
                      "labels": {
                          "cool.postgres/role": "app",
                      },
                  },
                  "spec": {
                      "forProvider": {
                          "region": region,
                          "name": app_secret_name,
                          "recoveryWindowInDays": 0,
                          "description": "Application user for %s; created and rotated by Lambda using the RDS master secret" % identifier,
                          "tags": {
                              "Name": app_secret_name,
                              "Project": "cool",
                          },
                      },
                      "providerConfigRef": provider,
                  },
              })

              rsp.desired.resources["app-secret-version"].resource.update({
                  "apiVersion": "secretsmanager.aws.m.upbound.io/v1beta1",
                  "kind": "SecretVersion",
                  "metadata": {
                      "name": k8s_app_secret,
                  },
                  "spec": {
                      "forProvider": {
                          "region": region,
                          "secretId": app_secret_name,
                          "secretStringWoSecretRef": {
                              "name": seed_name,
                              "key": "secret-string",
                          },
                          "secretStringWoVersion": wo_version,
                      },
                      "providerConfigRef": provider,
                  },
              })

              rsp.desired.resources["app-external-secret"].resource.update({
                  "apiVersion": "external-secrets.io/v1",
                  "kind": "ExternalSecret",
                  "metadata": {
                      "name": k8s_app_secret,
                  },
                  "spec": {
                      "refreshInterval": "1h",
                      "secretStoreRef": {
                          "kind": "ClusterSecretStore",
                          "name": "aws-secretsmanager",
                      },
                      "target": {
                          "name": k8s_app_secret,
                          "creationPolicy": "Owner",
                      },
                      "data": [
                          {"secretKey": "username", "remoteRef": {"key": app_secret_name, "property": "username"}},
                          {"secretKey": "password", "remoteRef": {"key": app_secret_name, "property": "password"}},
                          {"secretKey": "host", "remoteRef": {"key": app_secret_name, "property": "host"}},
                          {"secretKey": "port", "remoteRef": {"key": app_secret_name, "property": "port"}},
                          {"secretKey": "dbname", "remoteRef": {"key": app_secret_name, "property": "dbname"}},
                      ],
                  },
              })

              fn_name = ("%s-app-rotate" % identifier)[:64]
              stack_name = ("%s-app-rotate" % identifier)[:128]
              lambda_src = "\n".join([
                  "import json,os,sys,ssl,boto3,urllib.request,zipfile,io",
                  "P='/tmp/p'",
                  "def w():",
                  " sys.path.insert(0,P)",
                  " if os.path.exists(P+'/pg8000'):return",
                  " os.makedirs(P,exist_ok=True)",
                  " for n in('six','asn1crypto','python-dateutil','scramp','pg8000'):",
                  "  j=json.load(urllib.request.urlopen('https://pypi.org/pypi/%s/json'%n,timeout=15))",
                  "  u=[x['url'] for x in j['urls'] if x['packagetype']=='wheel' and 'none-any' in x['filename']][0]",
                  "  zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(u,timeout=15).read())).extractall(P)",
                  "w()",
                  "import pg8000.native as pg",
                  "sm=boto3.client('secretsmanager',endpoint_url=os.environ.get('SECRETS_MANAGER_ENDPOINT'))",
                  "def G(a,s,t=None):",
                  " k={'SecretId':a,'VersionStage':s}",
                  " if t:k['VersionId']=t",
                  " return json.loads(sm.get_secret_value(**k)['SecretString'])",
                  "def C(d):",
                  " x=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT);x.check_hostname=0;x.verify_mode=ssl.CERT_NONE",
                  " try:return pg.Connection(user=d['username'],password=d['password'],host=d['host'],port=int(d.get('port')or 5432),database=d.get('dbname')or'postgres',ssl_context=x,timeout=10)",
                  " except:return",
                  "def handler(e,c):",
                  " a,t,s=e['SecretId'],e['ClientRequestToken'],e['Step']",
                  " m=sm.describe_secret(SecretId=a);v=m['VersionIdsToStages']",
                  " if t not in v or 'AWSCURRENT' in v[t]:return",
                  " if 'AWSPENDING' not in v[t]:raise ValueError('stage')",
                  " if s=='createSecret':",
                  "  try:G(a,'AWSPENDING',t);return",
                  "  except Exception:pass",
                  "  u=G(a,'AWSCURRENT');u['password']=sm.get_random_password(PasswordLength=32,ExcludeCharacters=':/@\"\\\\',ExcludePunctuation=True)['RandomPassword']",
                  "  sm.put_secret_value(SecretId=a,ClientRequestToken=t,SecretString=json.dumps(u),VersionStages=['AWSPENDING']);return",
                  " if s=='setSecret':",
                  "  p=G(a,'AWSPENDING',t)",
                  "  if C(p):return",
                  "  mst=G(p['masterarn'],'AWSCURRENT');q=dict(p);q['username']=mst['username'];q['password']=mst['password']",
                  "  n=C(q)",
                  "  if not n:raise ValueError('master')",
                  "  u,pw,db=p['username'],p['password'],p.get('dbname')or'app'",
                  "  ident=lambda x:n.run('SELECT quote_ident(:n)',n=x)[0][0]",
                  "  iu,idb=ident(u),ident(db)",
                  "  n.run(('ALTER' if n.run('SELECT 1 FROM pg_roles WHERE rolname=:u',u=u) else 'CREATE')+' ROLE %s WITH LOGIN PASSWORD :p'%iu,p=pw)",
                  "  n.run('GRANT CONNECT ON DATABASE %s TO %s'%(idb,iu));n.run('GRANT ALL ON SCHEMA public TO %s'%iu);n.close();return",
                  " if s=='testSecret':",
                  "  if not C(G(a,'AWSPENDING',t)):raise ValueError('login')",
                  " if s=='finishSecret':",
                  "  cur=None",
                  "  for i,st in v.items():",
                  "   if 'AWSCURRENT' in st:cur=i;break",
                  "  sm.update_secret_version_stage(SecretId=a,VersionStage='AWSCURRENT',MoveToVersionId=t,RemoveFromVersionId=cur)",
              ])
              zip_lines = "\n".join(["          " + ln for ln in lambda_src.split("\n")])
              cfn = "\n".join([
                  "AWSTemplateFormatVersion: '2010-09-09'",
                  "Resources:",
                  "  RotateRole:",
                  "    Type: AWS::IAM::Role",
                  "    Properties:",
                  "      AssumeRolePolicyDocument:",
                  "        Version: '2012-10-17'",
                  "        Statement:",
                  "          - Effect: Allow",
                  "            Principal: {Service: lambda.amazonaws.com}",
                  "            Action: sts:AssumeRole",
                  "      ManagedPolicyArns:",
                  "        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole",
                  "      Policies:",
                  "        - PolicyName: rotate",
                  "          PolicyDocument:",
                  "            Version: '2012-10-17'",
                  "            Statement:",
                  "              - Effect: Allow",
                  "                Action: [secretsmanager:DescribeSecret, secretsmanager:GetSecretValue, secretsmanager:PutSecretValue, secretsmanager:UpdateSecretVersionStage, secretsmanager:GetRandomPassword]",
                  "                Resource: '*'",
                  "  RotateFn:",
                  "    Type: AWS::Lambda::Function",
                  "    Properties:",
                  "      FunctionName: %s" % fn_name,
                  "      Runtime: python3.12",
                  "      Handler: index.handler",
                  "      Architectures: [arm64]",
                  "      Timeout: 60",
                  "      MemorySize: 256",
                  "      Role: !GetAtt RotateRole.Arn",
                  "      Environment:",
                  "        Variables:",
                  "          SECRETS_MANAGER_ENDPOINT: https://secretsmanager.%s.amazonaws.com" % region,
                  "      VpcConfig:",
                  "        SubnetIds: [%s]" % ", ".join(node_subnets),
                  "        SecurityGroupIds: [%s]" % rotate_sgs[0],
                  "      Code:",
                  "        ZipFile: |",
                  zip_lines,
                  "  RotatePerm:",
                  "    Type: AWS::Lambda::Permission",
                  "    Properties:",
                  "      FunctionName: !Ref RotateFn",
                  "      Action: lambda:InvokeFunction",
                  "      Principal: secretsmanager.amazonaws.com",
                  "Outputs:",
                  "  RotationLambdaARN:",
                  "    Value: !GetAtt RotateFn.Arn",
              ])
              rsp.desired.resources["rotate-stack"].resource.update({
                  "apiVersion": "cloudformation.aws.m.upbound.io/v1beta1",
                  "kind": "Stack",
                  "metadata": {
                      "name": stack_name,
                  },
                  "spec": {
                      "forProvider": {
                          "region": region,
                          "name": stack_name,
                          "capabilities": [
                              "CAPABILITY_IAM",
                              "CAPABILITY_NAMED_IAM",
                          ],
                          "templateBody": cfn,
                          "timeoutInMinutes": 15,
                      },
                      "providerConfigRef": provider,
                  },
              })

              lambda_arn = _lambda_arn(_obs(req, "rotate-stack"))
              if lambda_arn:
                  rsp.desired.resources["app-secret-rotation"].resource.update({
                      "apiVersion": "secretsmanager.aws.m.upbound.io/v1beta1",
                      "kind": "SecretRotation",
                      "metadata": {
                          "name": k8s_app_secret,
                      },
                      "spec": {
                          "forProvider": {
                              "region": region,
                              "secretId": app_secret_name,
                              "rotationLambdaArn": lambda_arn,
                              "rotateImmediately": False,
                              "rotationRules": {
                                  "automaticallyAfterDays": rotate_after,
                              },
                          },
                          "initProvider": {
                              "rotateImmediately": True,
                          },
                          "providerConfigRef": provider,
                      },
                  })
                  notes.append("app user %s created/rotated by Lambda using master secret" % app_user)
              else:
                  notes.append("waiting for Crossplane rotation Lambda stack")

              response.normal(rsp, "; ".join(notes))
              return
    - step: ready
      functionRef:
        name: function-auto-ready
